<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFD21E" />
  <meta name="description" content="HuggingStudio – File manager untuk repository Hugging Face" />
  <meta property="og:title" content="HuggingStudio" />
  <meta property="og:description" content="Kelola repository Hugging Face seperti Google Drive" />
  <meta property="og:type" content="website" />
  <title>HuggingStudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    /* Gaya awal minimal agar loading screen terlihat sebelum CSS utama dimuat */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Source Sans 3', system-ui, sans-serif; }
    body { background: #fff; color: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f0f0f; color: #e8e8e8; }
    }
    #app-loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.25rem;
      background: inherit;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    .hs-logo-boot {
      font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) { .hs-logo-boot { color: #e8e8e8; } }
    .hs-logo-boot span { color: #FF9D00; }
    .hs-spinner {
      width: 36px; height: 36px;
      border: 3px solid #e5e5e5;
      border-top-color: #FF9D00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Memuat HuggingStudio...">
    <div class="hs-logo-boot">Hugging<span>Studio</span></div>
    <div class="hs-spinner" aria-hidden="true"></div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

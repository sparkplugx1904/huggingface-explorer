<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f19" />
  <meta name="description" content="HuggingStudio – File manager untuk repository Hugging Face" />
  <meta property="og:title" content="HuggingStudio" />
  <meta property="og:description" content="Kelola repository Hugging Face seperti file manager kelas IDE" />
  <meta property="og:type" content="website" />
  <title>HuggingStudio</title>
  <script>
    /* Sinkron tema sebelum first paint agar tidak terjadi flash salah tema */
    try {
      if (sessionStorage.getItem('hs-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) { /* penyimpanan tidak tersedia — abaikan */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Gaya boot minimal sebelum CSS utama dimuat */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; }
    body { background: #05070d; color: #e7ecf5; }
    html[data-theme='light'] body { background: #f7f8fb; color: #101726; }
    #app-loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.25rem;
      background: inherit;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    .hs-logo-boot { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; }
    .hs-logo-boot span { color: #f59e0b; }
    .hs-spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(148, 158, 184, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Memuat HuggingStudio...">
    <div class="hs-logo-boot">Hugging<span>Studio</span></div>
    <div class="hs-spinner" aria-hidden="true"></div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
